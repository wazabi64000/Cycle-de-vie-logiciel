<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Module — WazabyCode</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <div id="navbar-root"></div>

  <main class="container module-layout page-main">
    <div>
      <iframe id="course-frame" class="course-frame" title="Contenu du cours" loading="lazy"></iframe>
    </div>

    <aside class="module-sidebar">
      <section class="dashboard-card">
        <h2 class="card-title">Progression module</h2>
        <div class="progress-track">
          <div id="module-progress-bar" class="progress-fill" style="width:0"></div>
        </div>
        <p id="module-progress-label" style="margin-top:0.5rem;font-size:0.9rem;text-align:right">0%</p>
      </section>

      <section class="dashboard-card">
        <h2 class="card-title">Score quiz (%)</h2>
        <div class="quiz-input-group">
          <input type="number" id="quiz-score" min="0" max="100" placeholder="0-100" aria-label="Score du quiz">
          <span style="font-size:0.85rem;color:var(--text-muted)">≥ 70% pour valider</span>
        </div>
      </section>

      <section class="dashboard-card" id="module-checklists"></section>

      <section class="dashboard-card" id="chapter-nav-card">
        <div id="chapter-nav"></div>
        <p style="margin-top:1rem">
          <a id="open-full-course" href="#" class="btn btn-ghost" style="width:100%;justify-content:center">
            Ouvrir le cours en pleine page ↗
          </a>
        </p>
      </section>
    </aside>
  </main>

  <div id="footer-root"></div>

  <script type="module" src="/js/app/module-page.js"></script>
</body>
</html>
