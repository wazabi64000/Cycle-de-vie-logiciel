<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img" aria-label="Pipeline CI/CD">
  <rect width="400" height="220" fill="#0f172a"/>
  <text x="200" y="28" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="14" font-weight="600">Pipeline CI/CD</text>
  <g font-family="system-ui" font-size="10">
    <rect x="16" y="80" width="56" height="40" rx="6" fill="#334155"/><text x="44" y="105" text-anchor="middle" fill="#e2e8f0">Push</text>
    <rect x="88" y="80" width="56" height="40" rx="6" fill="#3b82f6"/><text x="116" y="105" text-anchor="middle" fill="#fff">Lint</text>
    <rect x="160" y="80" width="56" height="40" rx="6" fill="#8b5cf6"/><text x="188" y="105" text-anchor="middle" fill="#fff">Tests</text>
    <rect x="232" y="80" width="56" height="40" rx="6" fill="#f59e0b"/><text x="260" y="105" text-anchor="middle" fill="#fff">Build</text>
