  <line x1="216" y1="100" x2="232" y2="100" stroke="#64748b" stroke-width="2"/>
  <line x1="288" y1="100" x2="304" y2="100" stroke="#64748b" stroke-width="2"/>
  <text x="200" y="160" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="11">GitHub Actions · GitLab CI · Jenkins</text>
  <rect x="120" y="175" width="160" height="28" rx="4" fill="none" stroke="#22c55e" stroke-width="1"/>
  <text x="200" y="194" text-anchor="middle" fill="#22c55e" font-size="10" font-family="system-ui">staging ’ production</text>
