<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img" aria-label="Diagramme UML">
  <rect width="400" height="220" fill="#0f172a"/>
  <rect x="20" y="80" width="100" height="60" rx="4" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <text x="70" y="105" text-anchor="middle" fill="#3b82f6" font-family="system-ui" font-size="12">Client</text>
  <text x="70" y="125" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="10">+ commander()</text>
  <rect x="150" y="80" width="100" height="60" rx="4" fill="none" stroke="#8b5cf6" stroke-width="2"/>
  <text x="200" y="105" text-anchor="middle" fill="#8b5cf6" font-family="system-ui" font-size="12">Commande</text>
  <text x="200" y="125" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="10">+ valider()</text>
  <rect x="280" y="80" width="100" height="60" rx="4" fill="none" stroke="#22c55e" stroke-width="2"/>
  <text x="330" y="105" text-anchor="middle" fill="#22c55e" font-family="system-ui" font-size="12">Paiement</text>
  <text x="330" y="125" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="10">+ payer()</text>
  <line x1="120" y1="110" x2="150" y2="110" stroke="#64748b" stroke-width="2"/>
  <polygon points="145,106 155,110 145,114" fill="#64748b"/>
  <line x1="250" y1="110" x2="280" y2="110" stroke="#64748b" stroke-width="2"/>
  <polygon points="275,106 285,110 275,114" fill="#64748b"/>
  <text x="200" y="30" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="14" font-weight="600">Diagramme de classes</text>
</svg>
